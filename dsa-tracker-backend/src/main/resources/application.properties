# ─── SERVER ───────────────────────────────────────────────
# Railway injects PORT automatically. Falls back to 8080 locally.
server.port=${PORT:8080}

# ─── DATABASE ─────────────────────────────────────────────
# Railway injects DATABASE_URL. For local, set in .env or replace directly.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/dsa_tracker}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA ──────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ─── JWT ──────────────────────────────────────────────────
# Change this to a long random string in Railway env vars
app.jwt.secret=${JWT_SECRET:dsa-tracker-super-secret-key-change-this-in-production-min-256-bits}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ─── CORS ─────────────────────────────────────────────────
# Your Vercel frontend URL. Comma separated for multiple.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ─── LOGGING ──────────────────────────────────────────────
logging.level.com.dsatracker=INFO
logging.level.org.springframework.security=WARN
